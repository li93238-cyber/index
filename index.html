function head(emp){return `<div class="top"><div><h1>Tushlik puli</h1><p class="sub">${WD[wd()]}, ${fdate()}. Bir kishiga ${fmt(amt())} so‘m</p></div><div><button data-a="theme">Tema: ${TN[T]}</button> ${emp?'<button data-a="unlock">Admin</button>':""}${!emp?'<button data-a="kiosk">Xodimlar rejimi</button>':""}</div></div>`+(emp?"":`<div class="tabs">${[["sign","Imzo"],["pay","To‘lov"+(payRows.length?" ("+payRows.length+")":"")],["req","So‘rovlar"+(reqs.length?" ("+reqs.length+")":"")],["today","Bugun"],["arch","Arxiv"],["staff","Xodimlar"],["set","Sozlamalar"]].map(t=>`<button class="${tab===t[0]?"on":""}" data-a="tab:${t[0]}">${t[1]}</button>`).join("")}</div>`)}
function card(e,i){const s=sigs[e.id],o=isOff(e),on=sel.has(e.id);
 let st="";if(s){const by=s.by&&s.by!==e.id?nmOf(s.by):"";st=s.paid?"To‘langan, "+(by?"pulni oldi: "+by:"o‘zi oldi"):"Imzo qo‘yilgan, to‘lov kutilmoqda"+(by?" ("+by+" oladi)":"");st+=", "+hm(s.ts)}else if(o)st="Dam kuni";
 return `<button class="em ${s?"tk":on?"sel":""}" style="--i:${Math.min(i||0,14)}" ${s||o?"disabled":""} data-a="pick:${e.id}"><span class="ck av" style="--h:${hue(e.name)}">${s||on?"✓":esc(ini(e.name))}</span><span class="nm">${nmH(e.name)}${st?`<small>${esc(st)}</small>`:""}</span></button>`}
function grid(){let h="";const t=q.trim().toLowerCase();
 R.depts.forEach(d=>{if(df&&df!==d.id)return;const L=R.emps.filter(e=>e.dept===d.id&&(!t||e.name.toLowerCase().includes(t)));if(!L.length)return;h+=`<h2>${esc(d.name)}</h2><div class="grid">${L.map((e,i)=>card(e,i)).join("")}</div>`});
 return h||'<p class="sub">Hech kim topilmadi.</p>'}
function bar(){const n=sel.size;return `<div class="bar"><div><b>${n?"Tanlandi: "+n:"Ismingizni tanlang"}</b><p class="sub">${n?"Jami: "+fmt(n*amt())+" so‘m":"Bir nechta xodimni tanlab, birga imzo qo‘yish mumkin"}</p></div><button class="pri" ${n&&!(closed&&(!admin||kiosk))?"":"disabled"} data-a="sign">Imzo qo‘yish</button></div>`}
function signView(){return `<input class="srch" id="q" placeholder="Ismingizni qidiring" value="${esc(q)}" autocomplete="off"><div class="chips"><button class="${df?"":"on"}" data-a="df:0">Hammasi</button>${R.depts.map(d=>`<button class="${df===d.id?"on":""}" data-a="df:${d.id}">${esc(d.name)}</button>`).join("")}</div>${closed?'<p class="er">Bu kun yakunlangan'+((!admin||kiosk)?", imzo qo‘yib bo‘lmaydi.":".")+"</p>":""}<div id="gc">${grid()}</div>${(!admin||kiosk)?'<p style="text-align:center;margin-top:24px"><button data-a="req">Ro‘yxatda yo‘qmisiz? Xodim qo‘shish so‘rovi</button></p>':""}${bar()}`}
function todayView(){let on=0,off=0,got=0,sum=0,paidSum=0;R.emps.forEach(e=>{const s=sigs[e.id];if(s){got++;sum+=s.amt;if(s.paid)paidSum+=s.amt}else if(isOff(e))off++;else on++});
 const L=Object.values(sigs).sort((a,b)=>b.ts-a.ts),w=R.emps.filter(e=>!sigs[e.id]&&!isOff(e));
 return `${date!==todayS()?'<p class="sub" style="margin:0 0 8px">Arxiv ko‘rinishi. <button data-a="totoday">Bugunga qaytish</button></p>':""}<label class="sub" style="margin:0">Sana <input type="date" id="dt" value="${date}"></label> <button class="pri" data-a="print">A4 hisobot (imzolar bilan)</button> <button data-a="${closed?"reopen":"close"}">${closed?"Kunni qayta ochish":"Kunni yakunlash"}</button><div class="stats"><div class="k"><small>Olganlar</small><b>${got}</b></div><div class="k"><small>Hali olmagan</small><b>${on}</b></div><div class="k"><small>Dam</small><b>${off}</b></div><div class="k"><small>To‘langan</small><b>${fmt(paidSum)}</b></div><div class="k"><small>To‘lanmagan</small><b>${fmt(sum-paidSum)}</b></div></div><div class="acts" style="justify-content:flex-start;margin:0 0 8px">${L.length?'<button data-a="tsall">Hammasini belgilash</button>':""}${tsel.size?`<button data-a="tsclr">Tanlovni tozalash</button><button class="d" data-a="tscancel">Tanlanganlarni bekor qilish (${tsel.size})</button>`:""}</div><h2>Imzolar (${L.length})</h2>${L.map((s,i)=>{const by=s.by&&s.by!==s.emp?", oluvchi: "+nmOf(s.by):"";return `<div class="r" style="--i:${Math.min(i,14)}"><input type="checkbox" ${tsel.has(s.emp)?"checked":""} data-a="ts:${s.emp}" aria-label="Tanlash">${s.img?`<img src="${s.img}" alt="imzo">`:'<span class="sub">…</span>'}<div class="nm">${nmH(s.name)}<small>${esc(dn(s.dept))}, ${hm(s.ts)}, ${fmt(s.amt)} so‘m, ${s.paid?"to‘langan":"to‘lanmagan"}${esc(by)}</small></div><button class="d" data-a="rm:${s.emp}">Bekor qilish</button></div>`}).join("")||'<p class="sub">Hali imzo yo‘q.</p>'}<h2>Hali olmaganlar (${w.length})</h2><div class="tags">${w.map(e=>`<span class="tag">${nmH(e.name)}</span>`).join("")||"Hammasi oldi."}</div>`}
function staffView(){let h=`<div class="add"><input id="nn" placeholder="Yangi xodim F.I.O"><select id="nd">${dopts(R.depts[0]&&R.depts[0].id)}</select><select id="nw">${wopts(null)}</select><button class="pri" data-a="addE">Xodim qo‘shish</button></div><div class="add"><input id="ndn" placeholder="Yangi bo‘lim nomi"><button data-a="addD">Bo‘lim qo‘shish</button></div>`;
 R.depts.forEach(d=>{const L=R.emps.filter(e=>e.dept===d.id);h+=`<input class="dn" value="${esc(d.name)}" data-c="dr:${d.id}">`+L.map(e=>`<div class="sr${isOff(e)?" off":""}"><input value="${esc(e.name)}" data-c="en:${e.id}"><select data-c="ed:${e.id}">${dopts(e.dept)}</select><select data-c="ew:${e.id}">${wopts(e.off)}</select><label class="tg"><input type="checkbox" ${isOff(e)?"checked":""} data-c="eo:${e.id}">Dam (${fdate()})</label><button class="d" data-a="de:${e.id}">O‘chirish</button></div>`).join("")+(L.length?"":`<button class="d" data-a="dd:${d.id}">Bo‘limni o‘chirish</button>`)});return h}
function setView(){return `<div class="add" style="flex-direction:column"><label class="sub" style="margin:0">Bir kishiga tushlik puli (so‘m)<input type="number" step="1000" min="0" value="${R.amount}" data-c="amt" style="width:100%"></label><label class="sub" style="margin:0">Admin PIN kodi (4 ta raqam)<input value="${esc(PIN)}" inputmode="numeric" maxlength="4" data-c="pin" style="width:100%"></label><button class="pri" data-a="kiosk">Xodimlar rejimini yoqish</button></div>`}
function payView(){const B={};payRows.forEach(x=>{const k=x.date+"_"+x.ts;(B[k]=B[k]||{date:x.date,ts:x.ts,by:x.by,rows:[]}).rows.push(x)});let tot=0;payRows.forEach(x=>tot+=Number(x.amt));
 let h=`<div class="stats"><div class="k"><small>To‘lanishi kerak</small><b>${payRows.length}</b> kishi</div><div class="k"><small>Umumiy summa</small><b>${fmt(tot)}</b> so‘m</div><div class="k"><small>Alohida ro‘yxatlar</small><b>${Object.keys(B).length}</b> ta</div></div>`;
 if(!payRows.length)return h+'<p class="sub">To‘lanmagan imzo yo‘q.</p>';
 const ps=[...psel].reduce((a,k)=>a+Number((payRows.find(x=>x.date+"_"+x.emp===k)||{}).amt||0),0);
 h+=`<div class="acts" style="justify-content:flex-start;margin:0 0 8px"><button class="pri" data-a="paysel" ${psel.size?"":"disabled"}>To‘landi: ${psel.size} kishi, ${fmt(ps)} so‘m</button><button class="d" data-a="paycancel" ${psel.size?"":"disabled"}>Bekor qilish (${psel.size})</button><button data-a="payall">Hammasini belgilash</button><button data-a="payclr">Tanlovni bekor qilish</button></div>`;
 let cd="";
 Object.values(B).sort((a,b)=>a.date===b.date?a.ts-b.ts:(a.date<b.date?1:-1)).forEach(b=>{
  if(b.date!==cd){cd=b.date;h+=`<h2>${cd===todayS()?"Bugun":cd.split("-").reverse().join(".")}</h2>`}
  const on=b.rows.every(x=>psel.has(x.date+"_"+x.emp)),sum=b.rows.reduce((a,x)=>a+Number(x.amt),0),who=(b.rows.find(x=>x.emp===b.by)||b.rows[0]).name;
  h+=`<button class="em ${on?"sel":""}" style="width:100%;margin-bottom:8px;align-items:flex-start" data-a="pb:${b.date}_${b.ts}"><span class="ck">${on?"✓":""}</span><span style="flex:1"><b>Pulni oladi: ${esc(fn(who))}</b><small>${b.rows.length} kishi uchun, ${hm(b.ts)}</small><span class="tags" style="display:flex;margin-top:8px;font-weight:500">${b.rows.map(x=>`<span class="tag">${nmH(x.name)}<i>${fmt(x.amt)}</i></span>`).join("")}</span></span><b>${fmt(sum)} so‘m</b></button>`});
 return h}
function reqView(){if(!reqs.length)return '<p class="sub">Yangi so‘rovlar yo‘q.</p>';return reqs.map(q=>`<div class="sr"><input data-c="rq" id="rq${q.id}" value="${esc(q.name)}"><select data-c="rq" id="rqd${q.id}">${dopts(q.dept)}</select><button class="pri" data-a="ap:${q.id}">Tasdiqlash</button><button class="d" data-a="rj:${q.id}">Rad etish</button></div>`).join("")}
function archView(){if(!daysList.length)return '<p class="sub">Arxiv bo‘sh.</p>';return daysList.map(d=>`<div class="r"><div><b>${d.date.split("-").reverse().join(".")}</b> ${WD[new Date(d.date+"T12:00:00").getDay()]}<p class="sub" style="margin:0">${d.n} kishi, ${fmt(d.sum)} so‘m. To‘langan: ${d.paidN} (${fmt(d.paidSum)})${d.n>d.paidN?`. <span style="color:var(--dan)">To‘lanmagan: ${d.n-d.paidN} (${fmt(d.sum-d.paidSum)})</span>`:""}${d.closed?"":". Kun ochiq"}</p></div><button data-a="op:${d.date}">Ochish</button></div>`).join("")}
function render(){
 const e=!admin||kiosk,a=document.activeElement,keep=a&&a.id==="q"?a.selectionStart:null;
 if(e&&date!==todayS()){date=todayS();subSigs()}
 if(!loaded){$("app").innerHTML=head(true)+'<p class="sub">'+(errMsg||"Yuklanmoqda…")+"</p>";return}
 if(!R){$("app").innerHTML=head(e)+"<p>Ro‘yxat bo‘sh.</p>"+(admin&&!e?'<button class="pri" data-a="init">Boshlang‘ich ro‘yxatni yuklash</button>':"");return}
 {const vk=(e?"e":"a")+"|"+tab+"|"+date+"|"+df;$("app").className=vk!==lastVK?"fresh":"";lastVK=vk}
 $("app").innerHTML=head(e)+(e||tab==="sign"?signView():tab==="pay"?payView():tab==="req"?reqView():tab==="today"?todayView():tab==="arch"?archView():tab==="staff"?staffView():setView());
 if(keep!==null){const i=$("q");if(i){i.focus();i.setSelectionRange(keep,keep)}}
}
const chk=()=>{const o=$("ok");if(o)o.disabled=!(inkOn&&(sids.length<2||sby))};
function openSign(){const ids=[...sel].filter(i=>!sigs[i]);if(!ids.length)return;sids=ids;sby=ids[0];inkOn=false;
 $("mo").innerHTML=`<div class="ov"><div class="mo"><h3>Imzo qo‘ying</h3><p class="sub" style="margin:0 0 10px">${ids.map(i=>esc(fn(emp(i).name))).join(", ")}<br><b>Olinadigan summa: ${fmt(ids.length*amt())} so‘m</b></p>${ids.length>1?`<p class="sub" style="margin:6px 0 8px"><b>Pulni oladi:</b> ${esc(fn(emp(ids[0]).name))} (birinchi tanlangan)</p>`:""}<canvas id="cv" width="600" height="240"></canvas><p class="er" id="er"></p><div class="acts"><button data-a="clr">Tozalash</button><button data-a="cancel">Bekor qilish</button><button class="pri" id="ok" data-a="ok" disabled>Tasdiqlash</button></div></div></div>`;
 const c=$("cv"),x=c.getContext("2d");x.lineWidth=4;x.lineCap=x.lineJoin="round";x.strokeStyle="#111";let dr=false,ink=false,lx,ly;
 const P=v=>{const r=c.getBoundingClientRect();return[(v.clientX-r.left)*c.width/r.width,(v.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=v=>{dr=true;c.setPointerCapture(v.pointerId);[lx,ly]=P(v)};
 c.onpointermove=v=>{if(!dr)return;const[px,py]=P(v);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py;if(!ink){ink=true;inkOn=true;chk()}};
 c.onpointerup=c.onpointercancel=()=>{dr=false};
 padClear=()=>{x.clearRect(0,0,c.width,c.height);ink=false;inkOn=false;chk()}}
const closeMo=()=>{$("mo").innerHTML="";render()};
async function confirmSign(){const img=small($("cv")),ids=[...sel].filter(i=>!sigs[i]),ts=Date.now();
 $("ok").disabled=true;$("ok").textContent="Saqlanmoqda";
 try{const r=await api({action:"sign",date,ids,img,by:sby});if(!r.ok)throw r.err||1;last="";load();
  sel.clear();$("mo").innerHTML=`<div class="ov"><div class="mo" style="text-align:center"><div class="pp" style="font-size:56px;color:var(--ac)">✓</div><h3>Imzo qabul qilindi</h3><p>Imzo adminga yuborildi. To‘lanadigan summa: <b>${fmt(ids.length*amt())} so‘m</b></p><p class="sub" style="margin:0 0 10px">Admin tasdiqlagach kassadan oling.</p><button class="pri" data-a="cancel">Yopish</button></div></div>`;setTimeout(()=>{if($("mo").innerHTML)closeMo()},6000)}
 catch(e){$("ok").disabled=false;$("ok").textContent="Tasdiqlash";$("er").textContent=(typeof e==="string"?e:"Saqlab bo‘lmadi.")+" Qayta urinib ko‘ring."}}
function askPin(){$("mo").innerHTML=`<div class="ov"><div class="mo"><h3>Admin PIN</h3><input id="pi" type="password" inputmode="numeric" maxlength="4" style="width:100%;font-size:24px;text-align:center"><p class="er" id="er"></p><div class="acts"><button data-a="cancel">Bekor qilish</button><button class="pri" data-a="pin">Kirish</button></div></div></div>`;$("pi").focus()}
async function prt(){await needImgs(true);let h="",n=0,sum=0,got=0;
 R.depts.forEach(d=>{const L=R.emps.filter(e=>e.dept===d.id);if(!L.length)return;h+=`<tr><td class="dp" colspan="5">${esc(d.name)}</td></tr>`;
  L.forEach(e=>{n++;const s=sigs[e.id],o=isOff(e)&&!s;if(s){got++;sum+=s.amt}h+=`<tr class="${o?"o":""}"><td>${n}</td><td>${esc(fn(e.name))}</td><td>${s?fmt(s.amt):""}</td><td>${s&&s.img?`<img src="${s.img}" alt="">`:""}</td><td>${o?"Дам":""}</td></tr>`})});
 $("print").innerHTML=`<div class="ph"><div class="lg">ISHONCH</div><div class="t">Тушлик Пули</div><div class="d">Сана: <u>${fdate()}</u></div></div><table><thead><tr><th class="n">№</th><th class="f">ФИО</th><th class="s">Сумма</th><th>Имзо</th><th class="m">Дам</th></tr></thead><tbody>${h}</tbody></table><div class="pf"><span>Olganlar: ${got} ta</span><span>Jami: ${fmt(sum)} so‘m</span></div>`;
 setTimeout(()=>window.print(),300)}
function two(b,fn){if(b.dataset.s){fn();return}b.dataset.s=1;const o=b.textContent;b.textContent="Aniqmi?";setTimeout(()=>{b.dataset.s="";b.textContent=o},3000)}
function act(a,b){const[k,v]=a.split(":"),id=+v;
 if(k==="tab"){tab=v;render();needImgs();if(v==="pay")loadPay();if(v==="arch")loadDays()}
 else if(k==="df"){df=id;render()}
 else if(k==="pick"){sel.has(id)?sel.delete(id):sel.add(id);render()}
 else if(k==="sign")openSign();
 else if(k==="clr")padClear();
 else if(k==="cancel")closeMo();
 else if(k==="ok")confirmSign();
 else if(k==="kiosk"){kiosk=true;date=todayS();lsSet("ish_kiosk","1");subSigs();render()}
 else if(k==="unlock")askPin();
 else if(k==="pin"){const p=$("pi").value;api({action:"auth",pin:p}).then(r=>{if(r.ok){PIN=p;admin=true;kiosk=false;lsSet("ish_pin",p);lsSet("ish_kiosk","0");closeMo();last="";load();loadPay()}else $("er").textContent=r.err||"PIN noto‘g‘ri"})}
 else if(k==="init"){R=JSON.parse(JSON.stringify(SEED));saveR();render()}
 else if(k==="print")prt();
 else if(k==="ts"){tsel.has(id)?tsel.delete(id):tsel.add(id);render()}
 else if(k==="tsall"){Object.values(sigs).forEach(x=>tsel.add(x.emp));render()}
 else if(k==="tsclr"){tsel.clear();render()}
 else if(k==="tscancel")two(b,()=>api({action:"rmMany",pin:PIN,force:1,items:[...tsel].map(q=>date+"_"+q)}).then(()=>{tsel.clear();last="";load()}));
 else if(k==="by"){sby=id;document.querySelectorAll("#byc button").forEach(x=>x.classList.toggle("on",x.dataset.a==="by:"+id));chk()}
 else if(k==="pb"){const ks=payRows.filter(x=>x.date+"_"+x.ts===v).map(x=>x.date+"_"+x.emp),all=ks.every(q=>psel.has(q));ks.forEach(q=>all?psel.delete(q):psel.add(q));render()}
 else if(k==="theme"){T={auto:"light",light:"dark",dark:"auto"}[T];lsSet("ish_theme",T);applyT();render()}
 else if(k==="req")askReq();
 else if(k==="reqsend")sendReq();
 else if(k==="ap")api({action:"approve",pin:PIN,id:v,name:$("rq"+v).value,dept:$("rqd"+v).value}).then(()=>{last="";load()});
 else if(k==="rj")two(b,()=>api({action:"rejectReq",pin:PIN,id:v}).then(()=>{last="";load()}));
 else if(k==="pk"){psel.has(v)?psel.delete(v):psel.add(v);render()}
 else if(k==="payall"){payRows.forEach(x=>psel.add(x.date+"_"+x.emp));render()}
 else if(k==="payclr"){psel.clear();render()}
 else if(k==="paycancel")two(b,()=>api({action:"rmMany",pin:PIN,items:[...psel]}).then(()=>{psel.clear();lastPay="";loadPay();last="";load()}));
 else if(k==="paysel")two(b,()=>api({action:"pay",pin:PIN,items:[...psel]}).then(()=>{psel.clear();lastPay="";loadPay();last="";load()}));
 else if(k==="op"){date=v;tab="today";subSigs();render();needImgs()}
 else if(k==="totoday"){date=todayS();subSigs();render()}
 else if(k==="close")two(b,()=>api({action:"closeDay",pin:PIN,date}).then(()=>{last="";load()}));
 else if(k==="reopen")api({action:"reopen",pin:PIN,date}).then(()=>{last="";load()});
 else if(k==="rm")two(b,()=>api({action:"rmSig",pin:PIN,date,emp:id}).then(()=>{last="";load()}));
 else if(k==="addE"){const n=$("nn").value.replace(/\s+/g," ").trim();if(!n){$("nn").focus();return}const w=$("nw").value;upd(()=>R.emps.push({id:R.next++,name:n,dept:+$("nd").value,off:w===""?null:+w,days:{}}))}
 else if(k==="addD"){const n=$("ndn").value.trim();if(n)upd(()=>R.depts.push({id:R.next++,name:n}))}
 else if(k==="de")two(b,()=>upd(()=>{R.emps=R.emps.filter(e=>e.id!==id)}));
 else if(k==="dd")two(b,()=>upd(()=>{R.depts=R.depts.filter(d=>d.id!==id)}))}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled)act(b.dataset.a,b)});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value;$("gc").innerHTML=grid()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="dt"&&t.value){date=t.value;subSigs();render();return}
 if(!t.dataset.c||!R)return;const[k,v]=t.dataset.c.split(":"),id=+v,val=t.value;
 if(k==="amt")upd(()=>{R.amount=Math.max(0,+val||0)});
 else if(k==="pin"){const np=val.replace(/\D/g,"").slice(0,4);if(np.length===4)api({action:"setPin",pin:PIN,newPin:np}).then(r=>{if(r.ok){PIN=np;lsSet("ish_pin",np)}})}
 else if(k==="dr"){if(val.trim())upd(()=>{R.depts.find(d=>d.id===id).name=val.trim()})}
 else if(k==="en"){if(val.trim())upd(()=>{emp(id).name=val.replace(/\s+/g," ").trim()})}
 else if(k==="ed")upd(()=>{emp(id).dept=+val});
 else if(k==="ew")upd(()=>{emp(id).off=val===""?null:+val});
 else if(k==="eo")upd(()=>{const e=emp(id);e.days=e.days||{};e.days[date]=t.checked})});
(async()=>{applyT();render();if(PIN){const r=await api({action:"auth",pin:PIN});if(r.ok)admin=true}await load();loadPay();render()})();
</script></body></html>
